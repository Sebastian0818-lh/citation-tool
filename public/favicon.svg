<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8C4E38"/>
      <stop offset="100%" style="stop-color:#7D422D"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <!-- Letter B -->
  <text x="16" y="23" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="20" fill="#FFF6F3">B</text>
  <!-- Small accent dot -->
